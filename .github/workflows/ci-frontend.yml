name: ci-frontend

on:
  push:
    branches: [dev, staging, prod]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [dev, staging, prod]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

# Required by ADR-0009 branch protection on dev/staging/prod.
# Required by ADR-0012 Flow A auto-merge gate.

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test -- --run

      - name: Build (production)
        working-directory: frontend
        run: npm run build -- --configuration=production

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  lighthouse-and-axe:
    name: Lighthouse PWA + axe-core a11y budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-test-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download built bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Serve built bundle
        working-directory: frontend
        run: npx http-server dist/ -p 4200 -s &
        env:
          BROWSER: none

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4200 > /dev/null; then
              echo "Server up"; exit 0
            fi
            sleep 2
          done
          echo "Server did not start"; exit 1

      - name: Run Lighthouse CI
        working-directory: frontend
        run: |
          npm exec -- lhci autorun \
            --collect.url=http://localhost:4200 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.pwa=warn \
            --assert.assertions.performance=warn || true
        continue-on-error: true

      - name: Run axe-core a11y assertions
        working-directory: frontend
        run: |
          if npm run | grep -q "test:a11y"; then
            npm run test:a11y
          else
            echo "::warning::no test:a11y script defined yet — skipping"
          fi
        continue-on-error: true
