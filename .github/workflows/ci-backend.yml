name: ci-backend

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, staging, prod]

# Required by ADR-0009 branch protection on dev/staging/prod.
# Required by ADR-0012 Flow A auto-merge gate.
#
# Path filters intentionally removed: this workflow IS a required status
# check on dev/staging/prod, and GitHub treats a never-triggered required
# check as "pending" forever — which would deadlock docs-only PRs (e.g. the
# Flow B chore/flow-b-<date> PRs). Cost of running mvn verify on a docs-only
# PR is acceptable (~3-5 min, negligible per-feature) and trivially
# outweighed by avoiding the deadlock.

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # google-java-format uses javac-internal getDiagnostics() removed in JDK 25.
      # Run Spotless under JDK 21 (LTS) where the API still exists, then switch
      # back to JDK 25 for compilation so we keep the Java 25 target.
      - name: Set up JDK 21 (for google-java-format / Spotless)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Spotless formatting
        working-directory: backend
        run: ./mvnw -B spotless:check

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Cache the Testcontainers PostgreSQL image so CI doesn't re-pull ~350 MB on every run.
      # ubuntu-latest runners have Docker installed natively; no docker:dind service needed.
      - name: Restore Testcontainers Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-postgres-17-${{ runner.os }}

      - name: Load cached PostgreSQL image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-images/postgres-17.tar

      - name: Pull and cache PostgreSQL image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull postgres:17
          mkdir -p /tmp/docker-images
          docker save postgres:17 -o /tmp/docker-images/postgres-17.tar

      - name: Run Maven verify (compile + tests + Testcontainers integration)
        working-directory: backend
        run: ./mvnw -B verify

      - name: Generate OpenAPI snapshot from springdoc
        working-directory: backend
        run: |
          ./mvnw -B spring-boot:start
          mkdir -p ../docs/api
          curl -fsS http://localhost:8080/v3/api-docs.yaml -o ../docs/api/openapi.yaml || \
            echo "::warning::springdoc OpenAPI fetch failed — skipping snapshot update"
          ./mvnw -B spring-boot:stop
        continue-on-error: true

      - name: Commit OpenAPI snapshot if changed (push events only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if [[ -n "$(git status --porcelain docs/api/openapi.yaml)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/api/openapi.yaml
            git commit -m "docs(api): refresh openapi snapshot [skip ci]"
            git push origin HEAD:dev
          fi
        continue-on-error: true

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          retention-days: 7

  owasp-dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    # Skip on PRs from forks (NVD API key unavailable) and on draft PRs.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Get week number for OWASP cache key
        id: date
        run: echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-week-${{ steps.date.outputs.week }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Run OWASP dependency-check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY:-}" \
            -DfailBuildOnCVSS=8 \
            -DskipTestScope=true
        continue-on-error: ${{ secrets.NVD_API_KEY == '' }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
          retention-days: 14
