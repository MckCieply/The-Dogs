name: ci-e2e

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod]
    types: [labeled, synchronize, reopened, opened]
  schedule:
    # Nightly at 03:30 UTC = 04:30/05:30 Europe/Warsaw (winter/summer).
    # After Flow B (02:00 Europe/Warsaw on Mon/Wed/Fri) so they don't collide.
    - cron: '30 3 * * *'
  workflow_dispatch:

# Heavy: docker compose + Playwright. Run on staging/prod paths and nightly.
# For PRs to dev, opt-in via label `run-e2e`.

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e against docker compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Skip pull_request runs unless the `run-e2e` label is present.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend image
        working-directory: backend
        run: ./mvnw -B -DskipTests package spring-boot:build-image

      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Boot docker compose stack
        run: |
          cp .env.example .env || true
          docker compose -f docker-compose.yml up -d
          # Wait for backend health (max 90s).
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend healthy"; break
            fi
            sleep 3
          done
          # Wait for frontend (max 90s).
          for i in {1..30}; do
            if curl -fsS http://localhost:4200 > /dev/null 2>&1; then
              echo "Frontend healthy"; break
            fi
            sleep 3
          done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4200
        run: npm exec -- playwright test

      - name: Tear down docker compose
        if: always()
        run: docker compose -f docker-compose.yml down -v

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
