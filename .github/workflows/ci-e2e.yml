name: ci-e2e

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod]
    types: [labeled, synchronize, reopened, opened]
  schedule:
    # Nightly at 03:30 UTC = 04:30/05:30 Europe/Warsaw (winter/summer).
    # After Flow B (02:00 Europe/Warsaw on Mon/Wed/Fri) so they don't collide.
    - cron: '30 3 * * *'
  workflow_dispatch:

# Heavy: docker compose + Playwright. Run on staging/prod paths and nightly.
# For PRs to dev, opt-in via label `run-e2e`.

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e against docker compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Skip pull_request runs unless the `run-e2e` label is present.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')

    # Single source of truth for the account frontend/e2e/auth-refresh-logout.spec.ts logs in
    # as. The compose stack is a fresh DB every run (down -v below), so nothing else creates
    # this user — see "Seed e2e test account" below.
    env:
      E2E_TEST_EMAIL: e2e-trainer@example.com
      E2E_TEST_PASSWORD: 'Xk4$vQr9!wZp2mNt'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # docker compose builds both images itself (backend/Dockerfile multi-stage
      # Maven build, frontend/Dockerfile npm build + nginx). No host-side JDK or
      # Angular build needed — earlier versions of this workflow built a buildpack
      # image and a host bundle that compose never used.
      - name: Boot docker compose stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml up -d --build
          # Wait for backend health (max 90s) — fail loudly instead of letting
          # Playwright produce 30 confusing ERR_CONNECTION_REFUSED failures.
          ok=""
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend healthy"; ok=1; break
            fi
            sleep 3
          done
          if [[ -z "$ok" ]]; then
            echo "::error::Backend never became healthy on :8080"
            docker compose logs --tail 100
            exit 1
          fi
          # Wait for frontend nginx (compose maps it to host port 80, not 4200).
          ok=""
          for i in {1..30}; do
            if curl -fsS http://localhost:80 > /dev/null 2>&1; then
              echo "Frontend healthy"; ok=1; break
            fi
            sleep 3
          done
          if [[ -z "$ok" ]]; then
            echo "::error::Frontend never became healthy on :80"
            docker compose logs --tail 100
            exit 1
          fi

      # Every run starts from an empty DB, so the account auth-refresh-logout.spec.ts logs in
      # as never exists unless we create it here. Registration also strength-checks the password
      # (zxcvbn >= 3, see PasswordStrengthValidator) — E2E_TEST_PASSWORD is a random 16-char
      # string for that reason, not a memorable passphrase.
      #
      # AUTH-09 gates login on a confirmed email, so seeding is register + confirm. The first
      # registered user is bootstrapped as ROLE_ADMIN, and registration returns a grace-session
      # access token — that token authorizes the admin verification-token fetch (ADR-0013
      # pattern: no SMTP, tokens are retrieved out-of-band).
      - name: Seed e2e test account
        run: |
          status=$(curl -s -o /tmp/register-response.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$E2E_TEST_EMAIL\",\"password\":\"$E2E_TEST_PASSWORD\",\"displayName\":\"E2E Trainer\"}")
          if [[ "$status" != "201" ]]; then
            echo "::error::Failed to seed e2e test account (HTTP $status)"
            cat /tmp/register-response.json
            exit 1
          fi
          access_token=$(jq -r '.accessToken' /tmp/register-response.json)
          verify_token=$(curl -sf \
            -H "Authorization: Bearer $access_token" \
            "http://localhost:8080/api/v1/admin/email-verification-tokens?email=$E2E_TEST_EMAIL" \
            | jq -r '.token')
          status=$(curl -s -o /tmp/confirm-response.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/v1/auth/confirm-email \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$verify_token\"}")
          if [[ "$status" != "204" ]]; then
            echo "::error::Failed to confirm e2e test account email (HTTP $status)"
            cat /tmp/confirm-response.json
            exit 1
          fi
          echo "Seeded and email-confirmed e2e test account ($E2E_TEST_EMAIL)"

      - name: Install frontend dependencies (Playwright runner)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          # playwright.config.ts reads E2E_BASE_URL (NOT PLAYWRIGHT_BASE_URL).
          # The compose stack serves the frontend on host port 80.
          E2E_BASE_URL: http://localhost:80
        run: npm exec -- playwright test

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail 200

      - name: Tear down docker compose
        if: always()
        run: docker compose -f docker-compose.yml down -v

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
