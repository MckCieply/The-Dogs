spring:
  application:
    name: the-dogs-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thedogs}
    username: ${DB_USERNAME:thedogs}
    password: ${DB_PASSWORD:thedogs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

app:
  password-reset:
    # Dev-mode helper (ADR-0013): when true, the raw reset token is logged at INFO on creation.
    # MUST stay false outside dev/test — a leaked prod log would compromise every outstanding
    # token. The test profile overrides this to true (AC-12 asserts both directions).
    log-token-on-create: false
  email-verification:
    # Same posture as password-reset above (AUTH-09): raw verification tokens are logged at INFO
    # on creation only when true. MUST stay false outside dev/test.
    log-token-on-create: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.thedogs: INFO
